name: Build ModDash Android v1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout ModDash Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android NDK and CMake
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '25.2.9519653'
        cmake-version: '3.22.1'

    - name: Run CMake Configuration and Compilation
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-30 \
          -DANDROID_STL=c++_shared
        make

    - name: Upload ModDash Android Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libModDashAndroid-arm64
        path: build/libModDashAndroid.so
